<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Eye Badge Icon Box -->
  <rect x="10" y="15" width="90" height="90" rx="24" fill="url(#badgeGrad)" stroke="#292524" stroke-width="3" />
  
  <!-- Amber Eye Emblem Inside Box -->
  <g transform="translate(24, 29) scale(2.6)">
    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3.2" fill="#fbbf24"/>
  </g>

  <!-- AKORIX Typography -->
  <text x="120" y="68" fill="#0c0a09" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">AKORIX</text>
  
  <!-- DIGITAL Tag Badge -->
  <g transform="translate(315, 34)">
    <rect x="0" y="0" width="92" height="34" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
    <text x="12" y="23" fill="#78350f" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="1">DIGITAL</text>
  </g>

  <!-- Subtitle: Solutions Hub -->
  <text x="122" y="96" fill="#78716c" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3.5">SOLUTIONS HUB</text>
</svg>
